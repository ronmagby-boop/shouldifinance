# The weekly Instagram preview: one issue per post for the next Monday,
# Wednesday and Friday, each showing its own card, caption, alt text and
# preview hash. A post goes out unless its issue is closed or labelled "skip"
# (instagram-post.yml). Each issue pins its fact, so the three are distinct and
# never repeat a fact shown in another open issue.
#
# The same run counts the signed-off runway and, if fewer than six posts are
# left before the first unreviewed fact, opens or updates the "Review needed"
# issue with the next ten (instagram-review.yml acts on comments there).
#
# Reads the account to know what is already posted; never posts.
#
# Runs every Thursday at 15:00 UTC (8am Phoenix), and on demand.
name: Instagram preview

on:
  schedule:
    - cron: "0 15 * * 4"
  workflow_dispatch:
    inputs:
      preview_date:
        description: "Preview as of this date (YYYY-MM-DD); covers the Mon/Wed/Fri of the following week. Default: today (UTC)."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  issues: write

# Shares the post workflow's group, so a preview never reads the account while
# a post is going out.
concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IG_USER_ID: "17841452798031447"
      REVIEWER: ronmagby-boop
      # The scripts import app/lib/*.ts for check:facts; this quiets Node's
      # note that those files have no package type.
      NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
    steps:
      - uses: actions/checkout@v7

      # Node 24 imports app/lib/*.ts directly (check:facts).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # sharp and playwright-core, for the card input hash that decides whether
      # each card's recorded render warnings are current. Nothing is rendered.
      - name: Install dependencies
        run: npm ci

      - name: Mask credentials
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: |
          if [ -n "$IG_ACCESS_TOKEN" ]; then echo "::add-mask::$IG_ACCESS_TOKEN"; fi
          if [ -n "$IG_APP_SECRET" ]; then echo "::add-mask::$IG_APP_SECRET"; fi

      # Closes issues that can never post (from before this schedule, or past
      # their date) and works out which dates are pinned, reserved or skipped.
      - name: Plan the week from the open preview issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_DATE: ${{ inputs.preview_date }}
        run: node scripts/instagram/preview-issue.mjs plan --preview-date "${PREVIEW_DATE:-$(date -u +%F)}" --out plan.json

      - name: Build the previews (reads the account, posts nothing)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: node scripts/instagram/preview.mjs --plan plan.json --out preview.json

      - name: Open or refresh one issue per post
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_ASSIGNEE: ronmagby-boop
        run: node scripts/instagram/preview-issue.mjs open --preview preview.json

      - name: Open or update the Review needed issue if the runway is short
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/instagram/preview-issue.mjs review --preview preview.json

# Publishes the next scheduled Instagram card, or with dry_run (the default)
# shows what it would publish.
#
# What is already posted is read from the account's own media and matched to
# content/instagram-schedule.json; there is no state file and this workflow
# commits nothing. The publisher refuses the fact it is about to post if it
# has no current review sign-off, or if check:facts holds it (a constant it
# depends on changed); other held facts are listed as warnings.
#
# A scheduled run (and a manual run with as_scheduled) posts only what that
# day's preview issue showed (instagram-preview.yml): exactly its fact, by id
# and preview hash. It skips if there is no issue for the day, or it is closed
# or labelled "skip", and refuses if the post no longer matches the preview.
# So a skipped Monday never moves its fact into Wednesday: Wednesday posts the
# fact its own issue showed, and the skipped fact is previewed again next
# Thursday.
#
# Manual only for now. To turn posting on, uncomment the schedule: Monday,
# Wednesday and Friday at 15:00 UTC (8am Phoenix).
name: Instagram post

on:
  # schedule:
  #   - cron: "0 15 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read, match and check everything, but post nothing"
        type: boolean
        required: false
        default: true
      fact_id:
        description: "Optional: post this fact id instead of the next scheduled one"
        type: string
        required: false
        default: ""
      as_scheduled:
        description: "Behave like the scheduled run: post only what the preview issue for post_date shows"
        type: boolean
        required: false
        default: false
      post_date:
        description: "With as_scheduled: the preview issue's post date (YYYY-MM-DD). Default: today (UTC)."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  issues: write

# Never two publishing runs at once, so the next fact cannot be posted twice.
concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IG_USER_ID: "17841452798031447"
      # The publisher imports app/lib/*.ts for check:facts; this quiets Node's
      # note that those files have no package type.
      NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
    steps:
      - uses: actions/checkout@v7

      # Node 24: the publisher's check:facts imports app/lib/*.ts directly.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # GitHub already masks secrets; this registers them explicitly too. The
      # values come from env and are never interpolated into the command.
      - name: Mask credentials
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: |
          if [ -n "$IG_ACCESS_TOKEN" ]; then echo "::add-mask::$IG_ACCESS_TOKEN"; fi
          if [ -n "$IG_APP_SECRET" ]; then echo "::add-mask::$IG_APP_SECRET"; fi

      - name: Preview issue gate
        id: gate
        if: github.event_name == 'schedule' || inputs.as_scheduled
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POST_DATE: ${{ inputs.post_date }}
        run: node scripts/instagram/preview-issue.mjs gate --post-date "${POST_DATE:-$(date -u +%F)}"

      - name: Publish (or dry run)
        id: publish
        if: steps.gate.outcome == 'skipped' || steps.gate.outputs.decision == 'post'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          FACT_ID: ${{ inputs.fact_id }}
          EXPECT_FACT: ${{ steps.gate.outputs.expect_fact }}
          EXPECT_HASH: ${{ steps.gate.outputs.expect_hash }}
        run: |
          set --
          if [ "$DRY_RUN" = "false" ]; then set -- --live; else set -- --dry-run; fi
          if [ -n "$EXPECT_FACT" ]; then
            # The issue's fact, pinned by id and preview hash, not "the next one".
            if [ -n "$FACT_ID" ] && [ "$FACT_ID" != "$EXPECT_FACT" ]; then
              echo "FAILED: fact_id $FACT_ID is not the fact the preview issue shows ($EXPECT_FACT)."; exit 1
            fi
            set -- "$@" --fact-id "$EXPECT_FACT" --expect-fact "$EXPECT_FACT" --expect-hash "$EXPECT_HASH"
          elif [ -n "$FACT_ID" ]; then
            set -- "$@" --fact-id "$FACT_ID"
          fi
          node scripts/instagram/publish.mjs "$@"

      - name: Close the preview issue
        if: steps.gate.outputs.issue != '' && steps.publish.outputs.media_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.gate.outputs.issue }}
          PERMALINK: ${{ steps.publish.outputs.permalink }}
          MEDIA_ID: ${{ steps.publish.outputs.media_id }}
        run: node scripts/instagram/preview-issue.mjs done --issue "$ISSUE" --permalink "$PERMALINK" --media-id "$MEDIA_ID"

      - name: Say on the preview issue that the post was refused
        if: failure() && steps.gate.outputs.issue != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.gate.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/instagram/preview-issue.mjs refused --issue "$ISSUE" --run-url "$RUN_URL"
